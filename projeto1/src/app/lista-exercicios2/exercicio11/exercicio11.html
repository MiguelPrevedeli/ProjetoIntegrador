<label>
  <input
    type="checkbox"
    [(ngModel)]="somenteDisponiveis"
  >

  Mostrar somente produtos disponíveis
</label>

<br><br>

<ng-container *ngFor="let produto of produtos">

  <div *ngIf="!somenteDisponiveis || produto.quantidade > 0">

    <h3>{{ produto.nome }}</h3>

    <p>
      Preço:
      {{ produto.preco | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
    </p>

    <p>
      Quantidade:
      {{ produto.quantidade }}
    </p>

    <hr>

  </div>

</ng-container>
